<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask GCAI — Two Nations, One Legal Future</title>
<style>
  :root {
    --ink: #1c1b19;
    --paper: #faf8f4;
    --panel: #ffffff;
    --line: #e4e0d8;
    --accent: #2f5d50;
    --accent-soft: #e8f0ed;
    --muted: #756f64;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Iowan Old Style', 'Georgia', serif;
    background: var(--paper);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
  }
  header p {
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    color: var(--muted);
    margin: 4px 0 0;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    max-width: 420px;
  }
  .msg { max-width: 100%; line-height: 1.6; font-size: 15px; }
  .msg .label {
    display: block;
    font-family: -apple-system, sans-serif;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent-soft);
    padding: 10px 16px;
    border-radius: 10px 10px 2px 10px;
    font-family: -apple-system, sans-serif;
    font-size: 14px;
  }
  .msg.assistant { align-self: flex-start; }
  .msg.thinking { color: var(--muted); font-style: italic; }
  .msg.error { color: #a13c3c; }
  form#chatForm {
    display: flex;
    gap: 10px;
    padding: 16px 24px 20px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  #chatInput {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    background: var(--paper);
    color: var(--ink);
  }
  #chatInput:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #sendBtn {
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 0 20px;
    border: none;
    border-radius: 6px;
    background: var(--ink);
    color: white;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>Ask GCAI: Two Nations, One Legal Future</h1>
  <p>Ask about the London event, the reel series, or the BHASAD proposal. Answers are grounded strictly in the loaded source material.</p>
</header>

<div id="messages">
  <div class="empty-state" id="emptyState">Try asking things like "What did Lord Bellamy say about India and the rule of law?" or "What's included in the 100 reel pack?"</div>
</div>

<form id="chatForm">
  <input id="chatInput" type="text" placeholder="Ask a question..." autocomplete="off" />
  <button id="sendBtn" type="submit">Send</button>
</form>

<script>
let history = [];

const messagesEl = document.getElementById('messages');
const emptyState = document.getElementById('emptyState');
const chatForm = document.getElementById('chatForm');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

function addMessage(role, text, cls) {
  if (emptyState) emptyState.remove();
  const div = document.createElement('div');
  div.className = `msg ${role}${cls ? ' ' + cls : ''}`;
  const labelText = role === 'user' ? 'You' : 'Answer';
  div.innerHTML = `<span class="label">${labelText}</span>`;
  const body = document.createElement('div');
  body.textContent = text;
  div.appendChild(body);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = chatInput.value.trim();
  if (!question) return;

  addMessage('user', question);
  chatInput.value = "";
  chatInput.disabled = true;
  sendBtn.disabled = true;

  const thinkingDiv = addMessage('assistant', '', 'thinking');
  thinkingDiv.querySelector('div').textContent = 'Reading sources...';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, history })
    });
    const data = await res.json();

    thinkingDiv.classList.remove('thinking');

    if (!res.ok) {
      thinkingDiv.classList.add('error');
      thinkingDiv.querySelector('div').textContent = data.error || 'Something went wrong.';
    } else {
      thinkingDiv.querySelector('div').textContent = data.answer;
      history.push({ role: 'user', content: question });
      history.push({ role: 'assistant', content: data.answer });
    }
  } catch (err) {
    thinkingDiv.classList.remove('thinking');
    thinkingDiv.classList.add('error');
    thinkingDiv.querySelector('div').textContent = 'Network error: ' + err.message;
  }

  chatInput.disabled = false;
  sendBtn.disabled = false;
  chatInput.focus();
});
</script>

</body>
</html>
